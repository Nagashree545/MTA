name: Deploy React Build

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /root/MTA
            git pull origin main
            npm install
            npm run build
            rm -rf /var/www/react-app/*
            cp -r build/* /var/www/react-app/
